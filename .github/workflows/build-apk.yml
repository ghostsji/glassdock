name: Build & release Canvas

on:
  push:
    branches: [canvas-launcher]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing password is set
        env:
          CANVAS_KEY_PASSWORD: ${{ secrets.CANVAS_KEY_PASSWORD }}
        run: |
          if [ -z "$CANVAS_KEY_PASSWORD" ]; then
            echo "::error::Add the CANVAS_KEY_PASSWORD secret: repo Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build signed Lite and Full APKs
        env:
          CANVAS_KEY_PASSWORD: ${{ secrets.CANVAS_KEY_PASSWORD }}
          CANVAS_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleLiteRelease assembleFullRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir out
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "out/Canvas-Lite-$VERSION.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "out/Canvas-Full-$VERSION.apk"

      - name: Verify they're signed with the permanent key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          EXPECTED="959c1c66e10e86df6c64c987fcfbb7987236c6593d533c17d821c9322b553f06"
          for f in out/*.apk; do
            "$APKSIGNER" verify --print-certs "$f" | tee /tmp/certs.txt
            grep -qi "SHA-256 digest: $EXPECTED" /tmp/certs.txt || { echo "::error::$f is not signed with the Canvas key"; exit 1; }
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: canvas-v${{ env.VERSION }}
          name: Canvas ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: out/*.apk
          body: |
            **Canvas ${{ env.VERSION }}**

            ${{ github.event.head_commit.message }}

            - **Canvas-Lite** installs straight from your phone (no notification badges or lock/recents gestures).
            - **Canvas-Full** has everything; install it from a computer with `adb install -r`.

            Updating over an earlier 1.0.x keeps your home screen and settings.
